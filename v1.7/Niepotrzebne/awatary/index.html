<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valet · awatary</title>
<style>
/* Valet avatar lab: 20 reactive avatar ideas on one engine (state, pointer, press, voice level) plus a multi-type creator. */
:root { --paper: #f8f6f1; --ink0: #1d1c19; --muted: #7d7a72; --line: #e6e1d6; --green: #1f5a46; --soft: #ece8df; }
* { box-sizing: border-box; margin: 0; }
body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; background: var(--paper); color: var(--ink0); -webkit-font-smoothing: antialiased; --lvl: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.serif { font-family: ui-serif, "New York", "Iowan Old Style", Georgia, serif; }

.bar { position: sticky; top: 0; z-index: 20; background: rgba(248,246,241,.96); border-bottom: 1px solid var(--line); padding: 12px 20px calc(10px); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.bar h1 { font: 500 22px/1 ui-serif, "New York", Georgia, serif; margin-right: 6px; }
.seg { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.seg::-webkit-scrollbar { display: none; }
.seg button, .pill { height: 34px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.seg button.on { background: var(--ink0); color: var(--paper); border-color: var(--ink0); }
.pill.go { background: var(--green); color: #fff; border-color: var(--green); }
.pill.on { background: var(--ink0); color: var(--paper); border-color: var(--ink0); }
.hint { color: var(--muted); font-size: 13px; }

.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; padding: 20px; align-items: start; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 18px 12px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; position: relative; }
.card.sel { border-color: var(--ink0); box-shadow: 0 0 0 1px var(--ink0); }
.card h3 { font: 500 18px/1.1 ui-serif, "New York", Georgia, serif; margin-top: 8px; }
.card p { font-size: 12.5px; color: var(--muted); line-height: 1.3; min-height: 2.6em; }
.card .num { position: absolute; left: 12px; top: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .edit { margin-top: 2px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 12.5px; font-weight: 600; }

.maker { position: sticky; top: 74px; background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 16px; display: grid; gap: 14px; max-height: calc(100dvh - 90px); overflow-y: auto; }
.maker h2 { font: 500 20px/1 ui-serif, "New York", Georgia, serif; }
.mock { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 14px 12px 12px; display: grid; gap: 10px; }
.mock-top { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; justify-items: center; }
.rnd { width: 38px; height: 38px; border-radius: 50%; background: var(--soft); border: 0; display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.rnd svg { width: 18px; height: 18px; }
.status { grid-column: 1 / -1; margin-top: -8px; z-index: 3; padding: 4px 12px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font: italic 13px ui-serif, "New York", Georgia, serif; box-shadow: 0 2px 6px -3px rgba(0,0,0,.25); }
.bub { max-width: 86%; padding: 9px 13px; border-radius: 18px; font-size: 14.5px; line-height: 1.35; }
.bub.ag { background: var(--soft); justify-self: start; }
.bub.me { background: var(--ink0); color: var(--paper); justify-self: end; border-bottom-right-radius: 6px; }
.mock input { width: 100%; height: 40px; border-radius: 20px; border: 1px solid var(--line); background: #fff; padding: 0 14px; font-size: 16px; outline: none; }
.sizes { display: flex; align-items: flex-end; justify-content: center; gap: 18px; padding: 6px 0 2px; }
.ctl { display: grid; gap: 10px; }
.ctl label { display: grid; grid-template-columns: 104px 1fr; align-items: center; gap: 10px; font-size: 13.5px; color: var(--muted); }
.ctl select, .ctl input[type="text"] { height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); padding: 0 10px; color: var(--ink0); width: 100%; }
.ctl input[type="range"] { width: 100%; accent-color: var(--green); }
.colors { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.colors input[type="color"] { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 10px; padding: 2px; background: #fff; }
.sw { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(0,0,0,.14); padding: 0; }
.pixgrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; width: 184px; touch-action: none; }
.pixgrid i { aspect-ratio: 1; border-radius: 3px; background: var(--soft); }
.pixgrid i[data-k="1"] { background: var(--ink0); }
.pixgrid i[data-k="2"] { background: #2440d8; }
.pixgrid i[data-k="3"] { background: #d9822b; }
.pixgrid i[data-k="4"] { background: var(--green); }
.brush { display: flex; gap: 6px; flex-wrap: wrap; }
.brush button { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 12px; }
.brush button.on { background: var(--ink0); color: #fff; border-color: var(--ink0); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.shelf { display: flex; gap: 10px; flex-wrap: wrap; }
.shelf figure { display: grid; justify-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); position: relative; }
.shelf .del { position: absolute; right: -4px; top: -4px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-size: 12px; line-height: 1; padding: 0; z-index: 4; }
textarea { width: 100%; min-height: 70px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); padding: 8px 10px; font: 12px ui-monospace, Menlo, monospace; color: var(--ink0); display: none; }
textarea.show { display: block; }

.puck { --s: 104px; --lx: 0; --ly: 0; --sx: 0; --sy: 0; --ang: -90; --pk: #fff; --ink: #1d1c19; --acc: #1f5a46; width: var(--s); height: var(--s); border-radius: 50%; background: var(--pk); position: relative; flex: 0 0 auto; box-shadow: 0 0 0 1px rgba(0,0,0,.07), 0 10px 22px -14px rgba(40,35,20,.5); transition: transform .28s cubic-bezier(.3,1.7,.5,1), box-shadow .3s; cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.puck:hover { transform: scale(1.06); }
.puck:active { transform: scale(.88); }
.av { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; font-size: calc(var(--s) / 100); display: block; transition: opacity .3s; }
.av svg { width: 100%; height: 100%; display: block; }
.av svg * { transform-box: fill-box; transform-origin: center; transition: transform .3s cubic-bezier(.3,1.5,.5,1), opacity .25s; }
.av svg .c { transform-box: view-box; transform-origin: 50px 50px; }
.av .f { transition: transform .16s ease-out; }
.puck.off * { animation-play-state: paused !important; }

[data-state="sleeping"] .av { opacity: .55; }
[data-state="sleeping"] .puck::before { content: "z"; position: absolute; right: 2%; top: -6%; z-index: 2; font: italic 600 calc(var(--s) * .26) ui-serif, Georgia, serif; color: var(--ink0); animation: zz 2.6s ease-in-out infinite; }
[data-state="asking"] .puck::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--green); opacity: 0; animation: ping 1.5s ease-out infinite; pointer-events: none; }
[data-state="error"] .puck { box-shadow: 0 0 0 2.5px #c8402f, 0 10px 22px -14px rgba(40,35,20,.5); animation: shake .45s; }
[data-state="happy"] .puck { animation: hop .7s cubic-bezier(.3,1.4,.5,1); }
.puck.poke { animation: hop .55s cubic-bezier(.3,1.4,.5,1); }
[data-state="speaking"] .vox { animation: talk .42s ease-in-out infinite alternate; }
body.mic .vox { animation: none !important; transform: scale(calc(1 + var(--lvl) * .7)) !important; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes spinr { from { rotate: 0deg; } to { rotate: 360deg; } }
@keyframes blink { 0%, 91%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes scan { 0%, 100% { transform: translateX(-6px); } 50% { transform: translateX(6px); } }
@keyframes hop { 0%, 100% { translate: 0 0; } 35% { translate: 0 -12%; } 65% { translate: 0 3%; } }
@keyframes shake { 0%, 100% { translate: 0 0; } 20% { translate: -5% 0; } 40% { translate: 5% 0; } 60% { translate: -3% 0; } 80% { translate: 3% 0; } }
@keyframes ping { 0% { opacity: .9; transform: scale(.95); } 100% { opacity: 0; transform: scale(1.28); } }
@keyframes zz { 0%, 100% { transform: translate(0, 0); opacity: .9; } 50% { transform: translate(8%, -18%); opacity: .3; } }
@keyframes talk { from { transform: scale(1); } to { transform: scale(1.22); } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes tilt { 0%, 100% { transform: rotate(-11deg); } 50% { transform: rotate(11deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-9px); } 62% { transform: translateY(1px); } }
@keyframes quiver { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
@keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.66); } }
@keyframes ringk { 0%, 100% { transform: rotate(0); } 12% { transform: rotate(-10deg); } 26% { transform: rotate(9deg); } 40% { transform: rotate(-6deg); } 54% { transform: rotate(4deg); } 68% { transform: rotate(-2deg); } }
@keyframes wavef { 0% { opacity: 0; transform: scale(.85); } 20% { opacity: 1; } 70%, 100% { opacity: 0; transform: scale(1.12); } }
@keyframes tap { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3.5px); } }
@keyframes peek { 0%, 100% { transform: rotate(0); } 40%, 60% { transform: rotate(17deg); } }
@keyframes steam { 0% { opacity: 0; transform: translateY(7px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-9px); } }
@keyframes jiggle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.6px); } }
@keyframes keyturn { 0%, 100% { transform: scaleX(1); } 45%, 60% { transform: scaleX(-1); } }
@keyframes swing { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@keyframes swingbig { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(18deg); } }
@keyframes flicker { from { transform: scale(.85, .7); } to { transform: scale(1, 1); } }
@keyframes flickerbig { from { transform: scale(1.1, 1.3); } to { transform: scale(1.35, 1.75); } }
@keyframes rumble { 0%, 100% { transform: translate(-.7px, 0); } 50% { transform: translate(.7px, -.6px); } }
@keyframes starfall { from { transform: translateY(-16px); } to { transform: translateY(16px); } }
@keyframes launch { 0% { transform: translateY(0); } 38% { transform: translateY(-115px); } 39% { transform: translateY(115px); } 100% { transform: translateY(0); } }
@keyframes morph { 0%, 100% { border-radius: 58% 42% 55% 45% / 48% 56% 44% 52%; } 33% { border-radius: 44% 56% 42% 58% / 56% 44% 58% 42%; } 66% { border-radius: 52% 48% 60% 40% / 42% 58% 46% 54%; } }
@keyframes jelly { 0%, 100% { transform: scale(1, 1); } 25% { transform: scale(1.2, .82); } 50% { transform: scale(.88, 1.14); } 75% { transform: scale(1.06, .95); } }
@keyframes eq { from { transform: scaleY(.22); } to { transform: scaleY(1); } }
@keyframes breathe2 { 0%, 100% { transform: scaleY(.38); } 50% { transform: scaleY(.56); } }
@keyframes wave { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
@keyframes lit { 0%, 100% { opacity: .22; } 50% { opacity: 1; } }
@keyframes pings { 0% { transform: scale(1); opacity: .85; } 100% { transform: scale(3.6); opacity: 0; } }
@keyframes sweepbf { from { transform: rotate(-70deg); } to { transform: rotate(70deg); } }
@keyframes wob { 0%, 100% { transform: rotate(-38deg); } 50% { transform: rotate(38deg); } }
@keyframes shutter { 0%, 100% { transform: scale(1); } 50% { transform: scale(.12); } }
@keyframes flipy { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }
@keyframes sweep { 0% { transform: scaleX(0); transform-origin: 0 50%; } 50% { transform: scaleX(1); transform-origin: 0 50%; } 51% { transform: scaleX(1); transform-origin: 100% 50%; } 100% { transform: scaleX(0); transform-origin: 100% 50%; } }
@keyframes glide { from { transform: translateX(-7px) rotate(-6deg); } to { transform: translateX(7px) rotate(6deg); } }
@keyframes pblink { 0%, 90% { transform: scaleY(1); } 92%, 97% { transform: scaleY(.5); } 98%, 100% { transform: scaleY(1); } }
@keyframes pjump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes pshake { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
@keyframes ptalk { 0%, 49% { transform: scaleY(1); } 50%, 100% { transform: scaleY(.5); } }
@keyframes bouncey { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-11px); } }
@keyframes eqd { from { transform: scaleY(1); } to { transform: scaleY(2.3); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.45); } }
@keyframes fade { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }

.av-muszka .collar { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .32; }
.av-muszka .wing { fill: var(--ink); }
.av-muszka .wing.l { transform-origin: 100% 50%; }
.av-muszka .wing.r { transform-origin: 0% 50%; }
.av-muszka .knot { fill: var(--acc); }
.av-muszka .tiep { transform: translate(calc(var(--lx) * 4px), calc(var(--ly) * 4px)) rotate(calc(var(--lx) * 12deg)); }
.av-muszka .tie { animation: sway 5s ease-in-out infinite; }
[data-state="speaking"] .av-muszka .wing { animation: flap .32s ease-in-out infinite alternate; }
[data-state="working"] .av-muszka .wing { animation: flap .16s ease-in-out infinite alternate; }
[data-state="thinking"] .av-muszka .tie { animation: tilt 2.4s ease-in-out infinite; }
[data-state="listening"] .av-muszka .tie { animation: none; transform: scale(1.12); }
[data-state="asking"] .av-muszka .tie { animation: none; transform: rotate(-17deg); }
[data-state="happy"] .av-muszka .tie, .poke .av-muszka .tie { animation: spin .7s cubic-bezier(.3,1.2,.5,1); }
[data-state="sleeping"] .av-muszka .tie { animation: none; }
[data-state="sleeping"] .av-muszka .wing.l { transform: rotate(-15deg); }
[data-state="sleeping"] .av-muszka .wing.r { transform: rotate(15deg); }

.av-dzwonek path { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.av-dzwonek .dome { fill: var(--ink); stroke: none; }
.av-dzwonek .shine { stroke: var(--pk); stroke-width: 3; opacity: .5; }
.av-dzwonek .btn { stroke: var(--acc); }
.av-dzwonek .waves { opacity: 0; }
.av-dzwonek .waves path { stroke: var(--acc); stroke-width: 4; }
.av-dzwonek .bellp, .av-dzwonek .bell { transform-box: view-box; transform-origin: 50px 75px; }
.av-dzwonek .bellp { transform: rotate(calc(var(--lx) * 9deg)); }
.puck:active .av-dzwonek .btn { transform: translateY(4px); }
.poke .av-dzwonek .bell { animation: ringk .7s ease-out; }
.poke .av-dzwonek .waves { animation: wavef .7s ease-out; }
[data-state="asking"] .av-dzwonek .bell { animation: ringk 1.5s ease-out infinite; }
[data-state="asking"] .av-dzwonek .waves { animation: wavef 1.5s ease-out infinite; }
[data-state="working"] .av-dzwonek .btn { animation: tap .5s ease-in-out infinite; }
[data-state="thinking"] .av-dzwonek .bell { animation: sway 3s ease-in-out infinite; }
[data-state="speaking"] .av-dzwonek .waves { opacity: 1; }
[data-state="happy"] .av-dzwonek .bell { animation: ringk .5s ease-out 2; }
[data-state="happy"] .av-dzwonek .waves { animation: wavef .5s ease-out 2; }

.av-klosz path { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.av-klosz .d { fill: var(--ink); stroke: none; }
.av-klosz .knob { fill: var(--ink); }
.av-klosz .shine { stroke: var(--pk); stroke-width: 3; opacity: .5; }
.av-klosz .check { stroke: var(--acc); stroke-width: 6.5; opacity: 0; transform: scale(.4); }
.av-klosz .steam { opacity: 0; }
.av-klosz .steam path { stroke: var(--acc); stroke-width: 3.5; }
.av-klosz .domep { transform: translate(calc(var(--lx) * 2px), 0) rotate(calc(var(--lx) * 5deg)); }
.av-klosz .dome { transform-origin: 88% 100%; }
.poke .av-klosz .dome { animation: peek .6s ease-in-out; }
[data-state="working"] .av-klosz .steam { opacity: 1; }
[data-state="working"] .av-klosz .steam path { animation: steam 1.6s ease-in-out infinite; }
[data-state="working"] .av-klosz .steam path:nth-child(2) { animation-delay: .5s; }
[data-state="working"] .av-klosz .steam path:nth-child(3) { animation-delay: 1s; }
[data-state="working"] .av-klosz .dome { animation: jiggle .5s ease-in-out infinite; }
[data-state="thinking"] .av-klosz .knob { animation: bob 1s ease-in-out infinite; }
[data-state="asking"] .av-klosz .dome { animation: peek 1.5s ease-in-out infinite; }
[data-state="happy"] .av-klosz .dome { transform: rotate(40deg) translateY(-3px); }
[data-state="happy"] .av-klosz .check { opacity: 1; transform: scale(1); transition-delay: .15s; }

.av-klucz .bow { fill: none; stroke: var(--ink); stroke-width: 6; }
.av-klucz .hole { fill: var(--acc); }
.av-klucz .shaft { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.av-klucz .keyp, .av-klucz .hang { transform-box: view-box; transform-origin: 50px 30px; }
.av-klucz .keyp { transform: rotate(calc(26deg + var(--lx) * -30deg)); }
.av-klucz .hang { animation: swing 3.4s ease-in-out infinite; }
.poke .av-klucz .turn { animation: keyturn .6s ease-in-out; }
[data-state="thinking"] .av-klucz .hang { animation: swingbig 1.8s ease-in-out infinite; }
[data-state="working"] .av-klucz .turn { animation: keyturn 1.2s ease-in-out infinite; }
[data-state="asking"] .av-klucz .hang { animation: quiver .18s linear infinite; }
[data-state="speaking"] .av-klucz .hang { animation: swing .5s ease-in-out infinite; }
[data-state="listening"] .av-klucz .hole { transform: scale(1.5); }
[data-state="happy"] .av-klucz .turn { transform: scaleX(-1); }
[data-state="happy"] .av-klucz .hole { transform: scale(1.7); }
[data-state="sleeping"] .av-klucz .keyp { transform: rotate(0deg); }
[data-state="sleeping"] .av-klucz .hang { animation: none; }

.av-buzka .eye { fill: var(--ink); animation: blink 4.6s infinite; }
.av-buzka .eye.r { animation-delay: .05s; }
.av-buzka .mouth { fill: none; stroke: var(--ink); stroke-width: 4.5; stroke-linecap: round; }
.av-buzka .mouth.o { fill: var(--ink); stroke: none; }
.av-buzka .facep { transform: translate(calc(var(--lx) * 9px), calc(var(--ly) * 8px)); }
[data-state="listening"] .av-buzka .eyes { transform: scale(1.2); }
[data-state="thinking"] .av-buzka .face { transform: translate(-7px, -9px); }
[data-state="thinking"] .av-buzka .eye.r { animation: none; transform: scaleY(.5); }
[data-state="working"] .av-buzka .eyes { animation: scan 1.3s ease-in-out infinite; }
[data-state="asking"] .av-buzka .face { transform: rotate(-10deg); }
[data-state="asking"] .av-buzka .eye.l { animation: none; transform: translateY(-4px) scale(1.18); }
[data-state="happy"] .av-buzka .eye { animation: none; transform: scaleY(.28) translateY(-8px); }
[data-state="happy"] .av-buzka .mouth { transform: scale(1.35); }
[data-state="sleeping"] .av-buzka .eye { animation: none; transform: scaleY(.1); }
[data-state="error"] .av-buzka .eye { animation: none; }
[data-state="error"] .av-buzka .eye.l { transform: rotate(28deg) scaleY(.3); }
[data-state="error"] .av-buzka .eye.r { transform: rotate(-28deg) scaleY(.3); }
.puck:active .av-buzka .eye { animation: none; transform: scaleY(.15); }

.av-cyklop .sclera { fill: #fff; stroke: var(--ink); stroke-width: 4; }
.av-cyklop .ir { fill: var(--acc); }
.av-cyklop .pupil { fill: var(--ink); }
.av-cyklop .glint { fill: #fff; }
.av-cyklop .irisp { transform: translate(calc(var(--lx) * 10px), calc(var(--ly) * 10px)); }
.av-cyklop .ball { animation: blink 5s infinite; }
[data-state="listening"] .av-cyklop .pupil { transform: scale(1.55); }
[data-state="thinking"] .av-cyklop .iris { transform: translate(-6px, -9px); }
[data-state="working"] .av-cyklop .iris { animation: scan 1.1s ease-in-out infinite; }
[data-state="asking"] .av-cyklop .ball { animation: none; transform: scale(1.1) rotate(-8deg); }
[data-state="happy"] .av-cyklop .ball { animation: none; transform: scaleY(.42); }

  { type: "orbita", name: "Orbita", idea: "Planeta z pierścieniem, satelita przyspiesza przy pracy.", cfg: { pk: W, ink: K, acc: G } },

  { type: "radar", name: "Radar", idea: "Kontrola lotów. Kropka na ekranie śledzi Twój kursor.", cfg: { pk: "#10261f", ink: "#cfe7dc", acc: M } },
  { type: "kompas", name: "Kompas", idea: "Igła zawsze celuje w Ciebie, kręci się przy pracy.", cfg: { pk: W, ink: K, acc: G } },
  { type: "rakieta", name: "Rakieta", idea: "Wisi w powietrzu, odpala silnik przy pracy, startuje po sukcesie.", cfg: { pk: W, ink: K, acc: "#d9822b" } },
  { type: "piksel", name: "Piksel", idea: "Pikselowy lokaj w czapce. Narysujesz własnego w kreatorze.", cfg: { pk: W, ink: K, acc: G } },
  { type: "litera", name: "Litera V", idea: "Monogram Valeta w 3D, obraca się za kursorem.", cfg: { pk: G, ink: P, acc: Y } },
  { type: "litera", name: "Znak g", idea: "Znak Gzowo Labs jako agent.", cfg: { pk: K, ink: P, acc: Y, znak: "g" } },

];
const STATES = [["idle", "Spokój", "Czeka"], ["listening", "Słucha", "Słucha"], ["thinking", "Myśli", "Myśli"], ["working", "Pracuje", "Czyta źródło 3 z 5"], ["speaking", "Mówi", "Odpowiada"], ["asking", "Pyta", "Potrzebuje decyzji"], ["happy", "Gotowe", "Gotowe"], ["sleeping", "Śpi", "Śpi"], ["error", "Błąd", "Coś poszło nie tak"]];
const SWATCHES = [W, P, S, K, G, M, Y, "#b8821c", "#d9822b", "#2440d8", "#10261f"];

const $ = (id) => document.getElementById(id);
const body = document.body;
const defaults = (type) => Object.fromEntries([["pk", W], ["ink", K], ["acc", G], ...TYPES[type].params.map((p) => [p.k, p.def])]);

function mount(puck, a) {
  const c = { ...defaults(a.type), ...a.cfg };
  puck.style.setProperty("--pk", c.pk);
  puck.style.setProperty("--ink", c.ink);
  puck.style.setProperty("--acc", c.acc);
  if (a.type === "orbita") puck.style.setProperty("--tilt", c.tilt + "deg"); else puck.style.removeProperty("--tilt");
  puck.innerHTML = `<div class="av av-${a.type}">${TYPES[a.type].draw(c)}</div>`;
}

let cur = { type: PRESETS[0].type, name: PRESETS[0].name, cfg: { ...defaults(PRESETS[0].type), ...PRESETS[0].cfg } };
let selected = 0, brush = "1";

const gallery = $("gallery");
PRESETS.forEach((p, i) => {
  const card = document.createElement("article");
  card.className = "card";
  card.dataset.i = i;
  card.innerHTML = `<span class="num">${String(i + 1).padStart(2, "0")}</span><div class="puck"></div><h3>${p.name}</h3><p>${p.idea}</p><button class="edit">Edytuj</button>`;
  mount(card.querySelector(".puck"), p);
  gallery.append(card);
});

function poke(puck) {
  puck.classList.remove("poke");
  void puck.offsetWidth;
  puck.classList.add("poke");
  clearTimeout(puck._pt);
  puck._pt = setTimeout(() => puck.classList.remove("poke"), 1300);
}

document.addEventListener("click", (e) => {
  const puck = e.target.closest(".puck");
  if (puck) poke(puck);
  const edit = e.target.closest(".edit");
  if (edit) {
    const i = +edit.closest(".card").dataset.i, p = PRESETS[i];
    selected = i;
    cur = { type: p.type, name: p.name, cfg: { ...defaults(p.type), ...p.cfg } };
    renderMaker();
    if (matchMedia("(max-width: 900px)").matches) $("maker").scrollIntoView({ behavior: "smooth", block: "start" });
  }
});

function renderPreview() {
  [$("pmain"), ...document.querySelectorAll("[data-prev]")].forEach((p) => mount(p, cur));
  document.querySelectorAll(".card").forEach((c) => c.classList.toggle("sel", +c.dataset.i === selected));
  collect();
}

function renderMaker() {
  const ctl = $("ctl"), t = TYPES[cur.type];
  const colorRow = (k, label) => `<label>${label}<span class="colors"><input type="color" data-k="${k}" value="${cur.cfg[k]}">${SWATCHES.map((s) => `<button class="sw" style="background:${s}" data-k="${k}" data-v="${s}" aria-label="${s}"></button>`).join("")}</span></label>`;
  let html = `<label>Nazwa<input type="text" id="aname" maxlength="24" value="${esc(cur.name)}"></label>`;
  html += `<label>Rodzaj<select id="atype">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}"${k === cur.type ? " selected" : ""}>${v.name}</option>`).join("")}</select></label>`;
  html += colorRow("pk", "Krążek") + colorRow("ink", "Rysunek") + colorRow("acc", "Akcent");
  t.params.forEach((p) => {
    const v = cur.cfg[p.k];
    if (p.kind === "select") html += `<label>${p.label}<select data-k="${p.k}">${p.opts.map(([val, lab]) => `<option value="${val}"${val === v ? " selected" : ""}>${lab}</option>`).join("")}</select></label>`;
    if (p.kind === "range") html += `<label>${p.label}<input type="range" data-k="${p.k}" min="${p.min}" max="${p.max}" step="${p.step}" value="${v}"></label>`;
    if (p.kind === "text") html += `<label>${p.label}<input type="text" data-k="${p.k}" maxlength="${p.max}" value="${esc(v)}"></label>`;
    if (p.kind === "pixels") {
      html += `<label style="align-items:start">${p.label}<span><span class="brush">${[[".", "gumka"], ["1", "piksel"], ["2", "oko"], ["3", "usta"], ["4", "akcent"]].map(([k, l]) => `<button data-brush="${k}" class="${k === brush ? "on" : ""}">${l}</button>`).join("")}</span><span class="pixgrid" id="pix" style="margin-top:8px">${v.map((row, y) => [...row].map((k, x) => `<i data-i="${y * 8 + x}" data-k="${k}"></i>`).join("")).join("")}</span></span></label>`;
    }
  });
  ctl.innerHTML = html;
  renderPreview();
}

$("ctl").addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "aname") { cur.name = el.value; return; }
  if (el.id === "atype") { cur = { type: el.value, name: TYPES[el.value].name, cfg: { ...defaults(el.value), pk: cur.cfg.pk, ink: cur.cfg.ink, acc: cur.cfg.acc } }; selected = -1; renderMaker(); return; }
  if (el.dataset.k) { cur.cfg[el.dataset.k] = el.value; selected = -1; renderPreview(); }
});
$("ctl").addEventListener("click", (e) => {
  const sw = e.target.closest(".sw");
  if (sw) { cur.cfg[sw.dataset.k] = sw.dataset.v; selected = -1; renderMaker(); return; }
  const b = e.target.closest("[data-brush]");
  if (b) { brush = b.dataset.brush; $("ctl").querySelectorAll("[data-brush]").forEach((x) => x.classList.toggle("on", x === b)); }
});

let painting = false;
function paint(cell) {
  if (!cell || cell.dataset.i === undefined || !cell.closest("#pix") || cell.dataset.k === brush) return;
  cell.dataset.k = brush;
  const i = +cell.dataset.i, y = Math.floor(i / 8), x = i % 8;
  const rows = cur.cfg.px.map((r) => [...r]);
  rows[y][x] = brush;
  cur.cfg.px = rows.map((r) => r.join(""));
  selected = -1;
  renderPreview();
}
$("ctl").addEventListener("pointerdown", (e) => { if (e.target.closest("#pix")) { painting = true; paint(e.target); e.preventDefault(); } });
window.addEventListener("pointermove", (e) => { if (painting) paint(document.elementFromPoint(e.clientX, e.clientY)); });
window.addEventListener("pointerup", () => { painting = false; });

const rnd = (a) => a[Math.floor(Math.random() * a.length)];
$("rand").addEventListener("click", () => {
  const type = rnd(Object.keys(TYPES)), cfg = defaults(type);
  const combo = rnd([[W, K, G], [G, P, Y], [K, P, M], [S, K, G], [W, K, "#d9822b"], [W, K, "#2440d8"], ["#10261f", "#cfe7dc", M], [P, K, "#b8821c"]]);
  [cfg.pk, cfg.ink, cfg.acc] = combo;
  TYPES[type].params.forEach((p) => {
    if (p.kind === "select") cfg[p.k] = rnd(p.opts)[0];
    if (p.kind === "range") cfg[p.k] = p.min + Math.round(Math.random() * ((p.max - p.min) / p.step)) * p.step;
  });
  cur = { type, name: TYPES[type].name, cfg };
  selected = -1;
  renderMaker();
});

let mine = [];
try { mine = JSON.parse(localStorage.getItem("valet-avatars") || "[]"); } catch (e) { mine = []; }
function saveMine() { try { localStorage.setItem("valet-avatars", JSON.stringify(mine)); } catch (e) {} }
function renderShelf() {
  const shelf = $("shelf");
  shelf.innerHTML = mine.length ? "" : '<span class="hint" style="display:block">Jeszcze nic. Ustaw awatar i kliknij „Dodaj do moich”.</span>';
  mine.forEach((a, i) => {
    const f = document.createElement("figure");
    f.innerHTML = `<button class="del" data-del="${i}" aria-label="Usuń">×</button><div class="puck" style="--s:56px" data-mine="${i}"></div><figcaption>${esc(a.name)}</figcaption>`;
    mount(f.querySelector(".puck"), a);
    shelf.append(f);
  });
  collect();
}
$("keep").addEventListener("click", () => { mine.push(JSON.parse(JSON.stringify(cur))); saveMine(); renderShelf(); });
$("shelf").addEventListener("click", (e) => {
  const del = e.target.closest("[data-del]");
  if (del) { mine.splice(+del.dataset.del, 1); saveMine(); renderShelf(); return; }
  const m = e.target.closest("[data-mine]");
  if (m) { cur = JSON.parse(JSON.stringify(mine[+m.dataset.mine])); selected = -1; renderMaker(); }
});
$("copy").addEventListener("click", async () => {
  const text = JSON.stringify({ wybrany: cur, moi: mine }, null, 1);
  const out = $("out");
  out.value = text;
  out.classList.add("show");
  try { await navigator.clipboard.writeText(text); $("copy").textContent = "Skopiowano"; } catch (e) { out.select(); $("copy").textContent = "Zaznaczone, skopiuj"; }
  setTimeout(() => { $("copy").textContent = "Kopiuj ustawienia"; }, 1800);
});

const seg = $("seg");
STATES.forEach(([id, label]) => {
  const b = document.createElement("button");
  b.textContent = label;
  b.dataset.s = id;
  seg.append(b);
});
let sceneT = [];
function setState(s) {
  body.dataset.state = s;
  seg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.s === s));
  $("status").textContent = STATES.find((x) => x[0] === s)[2];
}
function stopScene() { sceneT.forEach(clearTimeout); sceneT = []; $("scene").classList.remove("on"); }
seg.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { stopScene(); setState(b.dataset.s); } });
function playScene() {
  stopScene();
  $("scene").classList.add("on");
  let t = 0;
  [["listening", 1400], ["thinking", 1700], ["working", 2800], ["speaking", 2200], ["asking", 2400], ["happy", 1700], ["idle", 0]].forEach(([s, d]) => {
    sceneT.push(setTimeout(() => { setState(s); if (s === "idle") $("scene").classList.remove("on"); }, t));
    t += d;
  });
}
$("scene").addEventListener("click", playScene);

let typeT = 0;
$("say").addEventListener("input", () => {
  stopScene();
  setState("listening");
  const p = $("pmain");
  p.style.setProperty("--lx", 0);
  p.style.setProperty("--ly", 0.9);
  p.style.setProperty("--sy", 1);
  clearTimeout(typeT);
  typeT = setTimeout(() => setState("idle"), 1400);
});
$("say").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !e.target.value.trim()) return;
  const b = document.createElement("div");
  b.className = "bub me";
  b.textContent = e.target.value.trim();
  e.target.before(b);
  e.target.value = "";
  clearTimeout(typeT);
  stopScene();
  $("scene").classList.add("on");
  let t = 0;
  [["thinking", 1500], ["working", 2600], ["speaking", 2000], ["happy", 1600], ["idle", 0]].forEach(([s, d]) => {
    sceneT.push(setTimeout(() => { setState(s); if (s === "idle") $("scene").classList.remove("on"); }, t));
    t += d;
  });
});

let pucks = [], centers = [], px = null, py = null, raf = 0, restT = 0;
const io = "IntersectionObserver" in window ? new IntersectionObserver((es) => es.forEach((en) => en.target.classList.toggle("off", !en.isIntersecting))) : null;
function collect() {
  pucks = [...document.querySelectorAll(".puck")];
  if (io) pucks.forEach((p) => { if (!p._io) { io.observe(p); p._io = 1; } });
  measure();
}
function measure() {
  centers = pucks.map((p) => { const r = p.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; });
}
function track() {
  raf = 0;
  pucks.forEach((p, i) => {
    let lx = 0, ly = 0, ang = -90;
    if (px !== null) {
      const dx = px - centers[i][0], dy = py - centers[i][1], dist = Math.hypot(dx, dy) || 1, k = Math.min(1, dist / 150);
      lx = (dx / dist) * k;
      ly = (dy / dist) * k;
      ang = Math.atan2(dy, dx) * 180 / Math.PI;
    }
    const prev = p._ang === undefined ? -90 : p._ang;
    ang += Math.round((prev - ang) / 360) * 360;
    p._ang = ang;
    const st = p.style;
    st.setProperty("--lx", lx.toFixed(3));
    st.setProperty("--ly", ly.toFixed(3));
    st.setProperty("--sx", Math.round(lx));
    st.setProperty("--sy", Math.round(ly));
    st.setProperty("--ang", ang.toFixed(1));
  });
}
function schedule() { if (!raf) raf = requestAnimationFrame(track); }
function point(e) {
  px = e.clientX;
  py = e.clientY;
  schedule();
  clearTimeout(restT);
  restT = setTimeout(() => { px = py = null; schedule(); }, 3500);
}
window.addEventListener("pointermove", point, { passive: true });
window.addEventListener("pointerdown", point, { passive: true });
document.addEventListener("pointerleave", () => { px = py = null; schedule(); });
window.addEventListener("scroll", () => { measure(); if (px !== null) schedule(); }, { passive: true });
window.addEventListener("resize", measure);
$("maker").addEventListener("scroll", measure, { passive: true });

let mic = null, lvl = 0;
function micLoop() {
  if (!mic) return;
  mic.an.getByteTimeDomainData(mic.buf);
  let s = 0;
  for (let i = 0; i < mic.buf.length; i++) { const v = (mic.buf[i] - 128) / 128; s += v * v; }
  lvl += (Math.min(1, Math.sqrt(s / mic.buf.length) * 5) - lvl) * 0.35;
  body.style.setProperty("--lvl", lvl.toFixed(3));
  requestAnimationFrame(micLoop);
}
$("micbtn").addEventListener("click", async () => {
  const btn = $("micbtn");
  if (mic) {
    mic.stream.getTracks().forEach((t) => t.stop());
    mic.ctx.close();
    mic = null;
    body.classList.remove("mic");
    body.style.setProperty("--lvl", 0);
    btn.classList.remove("on");
    btn.textContent = "Mikrofon";
    setState("idle");
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const an = ctx.createAnalyser();
    an.fftSize = 512;
    ctx.createMediaStreamSource(stream).connect(an);
    mic = { stream, ctx, an, buf: new Uint8Array(an.fftSize) };
    body.classList.add("mic");
    btn.classList.add("on");
    btn.textContent = "Mikrofon włączony";
    stopScene();
    setState("listening");
    micLoop();
  } catch (e) {
    btn.textContent = "Mikrofon niedostępny";
  }
});

setState(STATES.some((s) => s[0] === location.hash.slice(1)) ? location.hash.slice(1) : "idle");
renderMaker();
renderShelf();
</script>
