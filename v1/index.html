<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f6f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Valet">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Concierge Valet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" hidden>
  <header class="top">
    <button class="rnd" id="agents-btn" aria-label="Agenci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="8" cy="9" r="3.2"/><circle cx="16.5" cy="8" r="2.4"/><path d="M3 19c.6-3 2.6-4.6 5-4.6s4.4 1.6 5 4.6M14.5 13.6c2.6-.5 5 1 5.8 4"/></svg></button>
    <div class="puck tap" id="puck" data-state="idle" role="img" aria-label="Valet"></div>
    <button class="rnd" id="me-btn" aria-label="Ustawienia">J</button>
    <div class="status" id="status" hidden></div>
  </header>
  <main class="view" id="view-chat"><div class="thread" id="thread"></div></main>
  <main class="view" id="view-tasks" hidden><div class="list" id="tasks"></div></main>
  <main class="view" id="view-make" hidden><div class="list" id="make"></div></main>
  <footer class="bottom">
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Wiadomość" aria-label="Wiadomość" autocomplete="off" enterkeyhint="send"></textarea>
      <button class="send" id="send" aria-label="Wyślij" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </form>
    <nav class="tabs" id="tabs">
      <button data-tab="chat" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-11 6.6L4 19.5l1.4-4.3A7.5 7.5 0 1 1 20 11.5z"/></svg>Czat</button>
      <button data-tab="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg>Zadania<span class="badge" id="badge" hidden></span></button>
      <button data-tab="make"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4l1.8 5.2L18 11l-5.2 1.8L11 18l-1.8-5.2L4 11l5.2-1.8zM18.5 3.5v3M17 5h3M18.5 16.5v3M17 18h3"/></svg>Twórz</button>
    </nav>
  </footer>
</div>

<section id="pair" hidden>
  <form class="sheet-in" id="pair-form">
    <div class="puck" id="pair-puck"></div>
    <h1>Concierge Valet</h1>
    <p>Wpisz klucz dostępu, żeby połączyć to urządzenie z Twoim agentem.</p>
    <input id="pair-key" type="password" placeholder="Klucz dostępu" aria-label="Klucz dostępu" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn" type="submit">Połącz</button>
    <div class="err" id="pair-err"></div>
  </form>
</section>

<section id="sheet" hidden><div class="sheet-in" id="sheet-in"></div></section>

<script type="module" src="app.js"></script>
</body>
</html>
