name: Valet
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Valet:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Local
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.gzowo.valet.ios
        PRODUCT_NAME: Valet
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Valet
        UILaunchScreen:
          UIColorName: Paper
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: fun.gzowo.valet.ios
            CFBundleURLSchemes: [valet]
        NSMicrophoneUsageDescription: Valet słucha, gdy dyktujesz wiadomość albo z nim rozmawiasz.
        NSCameraUsageDescription: Valet używa aparatu, gdy robisz zdjęcie do wiadomości.
        NSPhotoLibraryAddUsageDescription: Valet zapisuje obrazki w Zdjęciach, gdy o to poprosisz.
