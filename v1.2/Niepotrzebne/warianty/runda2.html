<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Runda 2 · wygląd agenta</title>
<style>
/* Round 2 style variants: centered avatar with a live status pill, four looks and four avatar ideas on one template. */
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  background: #e9e8e5; color: #111; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.page-head { padding: 28px 32px 6px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.page-head h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
.page-head p { color: #6b6b6b; font-size: 14px; }
.row { display: flex; align-items: flex-start; gap: 34px; padding: 22px 42px 46px; overflow-x: auto; scroll-snap-type: x proximity; }
.slot { flex: 0 0 auto; scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.tag { font-size: 13.5px; font-weight: 600; color: #222; display: flex; gap: 8px; align-items: center; }
.tag b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #111; color: #fff; font-size: 12px; }
.tag span { color: #7a7a7a; font-weight: 500; }

.phone {
  width: 372px; min-height: 760px; border-radius: 46px; overflow: hidden; position: relative;
  display: flex; flex-direction: column;
  background: var(--bg); color: var(--fg); font-family: var(--font);
  box-shadow: 0 0 0 10px #0d0d0d, 0 30px 60px -22px rgba(0,0,0,.4);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --head: var(--font);
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
}

.top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; justify-items: center; padding: 16px 16px 10px; flex: 0 0 auto; }
.rnd { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--rnd-line); background: var(--rnd); color: var(--fg); display: grid; place-items: center; font-weight: 600; font-size: 15px; box-shadow: var(--rnd-shadow); }
.rnd svg { width: 20px; height: 20px; }
.puck { width: 66px; height: 66px; border-radius: 50%; background: var(--puck); border: 1px solid var(--puck-line); box-shadow: var(--puck-shadow); display: grid; place-items: center; position: relative; }
.status { grid-column: 1 / -1; margin-top: -9px; z-index: 1; padding: 5px 12px; border-radius: 999px; background: var(--pill); color: var(--fg); font-size: 12.5px; font-weight: 500; border: 1px solid var(--pill-line); box-shadow: 0 2px 6px -3px rgba(0,0,0,.25); }

.av { position: relative; display: grid; place-items: center; }
.av-orbit { width: 46px; height: 46px; }
.av-orbit .planet { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; border-radius: 50%; background: var(--accent); }
.av-orbit .tilt { position: absolute; inset: 0; transform: rotate(-24deg) scaleY(.4); }
.av-orbit .ring { position: absolute; inset: 2px; border: 2px solid var(--fg); border-radius: 50%; }
.av-orbit .front { clip-path: inset(50% 0 0 0); }
.av-orbit .spin { position: absolute; inset: 2px; animation: spin 3.6s linear infinite; }
.av-orbit .sat { position: absolute; left: 50%; top: -4px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--fg); transform: scaleY(2.5); }
.av-face { display: flex; gap: 9px; }
.av-face i { width: 8px; height: 13px; border-radius: 5px; background: var(--puck-fg); animation: blink 4.2s infinite; }
.av-bell { color: var(--puck-fg); transform-origin: 50% 85%; animation: ring 5s infinite; }
.av-bell svg { width: 34px; height: 34px; display: block; }
.av-g { color: var(--puck-fg); }
.av-g svg { width: 36px; height: 36px; display: block; }
.av-g::before { content: ""; position: absolute; inset: -16px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--busy); border-right-color: var(--busy); animation: spin 1.5s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.12); } }
@keyframes ring { 0%, 84%, 100% { transform: rotate(0); } 87% { transform: rotate(-10deg); } 90% { transform: rotate(8deg); } 93% { transform: rotate(-5deg); } 96% { transform: rotate(3deg); } }
@keyframes dot { 0%, 60%, 100% { opacity: .35; transform: none; } 30% { opacity: 1; transform: translateY(-2px); } }
@media (prefers-reduced-motion: reduce) { .av *, .av, .av::before, .typing i { animation: none !important; } }

.thread { flex: 1; min-height: 0; padding: 10px 16px 18px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; overscroll-behavior: contain; }
.thread::-webkit-scrollbar { display: none; }
.day, .sys { align-self: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
.msg { max-width: 84%; position: relative; padding: 10px 14px; border-radius: 20px; }
.msg p { font-size: 16px; line-height: 1.38; }
.me { align-self: flex-end; background: var(--me); color: var(--me-fg); border-bottom-right-radius: 7px; }
.ag { align-self: flex-start; background: var(--ag); color: var(--fg); box-shadow: var(--ag-shadow); }
.msg blockquote { font-size: 13px; color: var(--muted); border-left: 2px solid var(--quote); padding-left: 8px; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tapped { margin-bottom: 12px; }
.tap { position: absolute; left: 12px; bottom: -14px; background: var(--card); border-radius: 999px; font-size: 13px; line-height: 1; padding: 4px 7px; box-shadow: 0 0 0 2px var(--bg), 0 1px 3px rgba(0,0,0,.15); }
.typing { display: flex; gap: 5px; padding: 15px 15px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: dot 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }

.card { align-self: stretch; background: var(--card); border: 1px solid var(--card-line); border-radius: 22px; padding: 14px; box-shadow: var(--card-shadow); }

.sky-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.sky-head strong { font: 600 34px/1 var(--head); letter-spacing: -0.03em; }
.sky-head div span { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }
.sky-head em { font-style: normal; font-size: 13px; color: var(--muted); }
.sky-band { position: relative; height: 56px; border-radius: 14px; margin-top: 12px; overflow: hidden; background: linear-gradient(90deg, #f3c8a6 0%, #c3e2f6 13%, #86c4ef 40%, #9fb5c9 56%, #8094a9 78%, #2b3555 92%, #141a33 100%); }
.sky-band .rain { position: absolute; top: 0; bottom: 0; left: 56%; width: 26%; background: repeating-linear-gradient(108deg, rgba(255,255,255,.6) 0 1.5px, transparent 1.5px 7px); -webkit-mask-image: linear-gradient(180deg, transparent 30%, #000 70%); mask-image: linear-gradient(180deg, transparent 30%, #000 70%); }
.sky-band svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.sky-band path { fill: none; stroke: #fff; stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.sky-band .now { position: absolute; left: 38%; top: 12px; width: 13px; height: 13px; margin-left: -6.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.35); }
.sky-hours { display: flex; justify-content: space-between; padding: 6px 4px 0; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

.file { display: flex; align-items: center; gap: 10px; }
.ico { width: 38px; height: 46px; border-radius: 10px; background: var(--file); color: var(--file-fg); display: grid; place-items: center; flex: 0 0 auto; }
.ico svg { width: 20px; height: 20px; }
.file div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.file strong { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file span { font-size: 12.5px; color: var(--muted); }
.btn { font: 600 14.5px/1 var(--font); height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
.file .btn { height: 36px; padding: 0 14px; }
.solid { background: var(--accent); color: var(--accent-fg); }
.ghost { background: transparent; color: var(--fg); border-color: var(--ghost-line); }

.mail header { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
.mail header svg { width: 18px; height: 18px; }
.mail header .edit { margin-left: auto; color: var(--muted); }
.mail .line { font-size: 14px; color: var(--muted); padding: 9px 0; border-bottom: 1px solid var(--line); }
.mail .line b { color: var(--fg); font-weight: 500; }
.mail p { font-size: 14.5px; line-height: 1.4; margin-top: 10px; }
.att { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; font-weight: 600; margin-top: 12px; }
.att svg { width: 16px; height: 16px; flex: 0 0 auto; }
.att span { margin-left: auto; color: var(--muted); font-weight: 400; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.outcome { display: none; margin-top: 12px; font-size: 13.5px; color: var(--muted); }
.mail.done .btns { display: none; }
.mail.done .outcome { display: block; }

.bottom { flex: 0 0 auto; background: var(--bg); padding-bottom: env(safe-area-inset-bottom); }
.composer { display: flex; align-items: center; gap: 8px; padding: 8px 12px 6px; }
.field { flex: 1; min-width: 0; height: 44px; border-radius: 22px; border: 1px solid var(--field-line); background: var(--field); display: flex; align-items: center; padding: 0 5px 0 16px; box-shadow: var(--rnd-shadow); }
.field input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: 16px var(--font); outline: none; }
.field input::placeholder { color: var(--muted); }
.mic { width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; color: var(--fg); display: grid; place-items: center; }
.mic svg { width: 19px; height: 19px; }
.composer .rnd.send { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); padding: 2px 10px 12px; }
.tabs button { background: none; border: 0; color: var(--muted); font: 500 11px/1 var(--font); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; }
.tabs button.on { color: var(--fg); font-weight: 600; }
.tabs svg { width: 22px; height: 22px; }

[data-t="kreda"] {
  --head: var(--serif);
  --bg: #f8f6f1; --fg: #1d1c19; --muted: #7d7a72; --line: #e9e4d9;
  --ag: #ece8df; --ag-shadow: none; --me: #1f1e1b; --me-fg: #f8f6f1; --quote: #1f5a46;
  --card: #fff; --card-line: #e6e1d6; --card-shadow: none;
  --accent: #1f5a46; --accent-fg: #fff; --ghost-line: #c9c3b6; --busy: #1f5a46;
  --puck: #fff; --puck-fg: #1d1c19; --puck-line: #e6e1d6; --puck-shadow: 0 8px 20px -12px rgba(40,35,20,.35);
  --pill: #fff; --pill-line: #e6e1d6;
  --rnd: #efebe3; --rnd-line: transparent; --rnd-shadow: none;
  --field: #fff; --field-line: #e0dbcf; --file: #1f5a46; --file-fg: #fff;
}
[data-t="kreda"] .mail header strong { font: 500 18px var(--serif); }
[data-t="kreda"] .status { font: italic 13.5px var(--serif); }

[data-t="atrament"] {
  --bg: #f5f6f9; --fg: #0f1222; --muted: #7a7f90; --line: #e3e6ee;
  --ag: #e7eaf1; --ag-shadow: none; --me: #2440d8; --me-fg: #fff; --quote: #2440d8;
  --card: #fff; --card-line: #dfe3ec; --card-shadow: none;
  --accent: #2440d8; --accent-fg: #fff; --ghost-line: #c9cfdd; --busy: #2440d8;
  --puck: #2440d8; --puck-fg: #fff; --puck-line: transparent; --puck-shadow: 0 10px 22px -12px rgba(36,64,216,.7);
  --pill: #fff; --pill-line: #dfe3ec;
  --rnd: #e7eaf1; --rnd-line: transparent; --rnd-shadow: none;
  --field: #fff; --field-line: #dfe3ec; --file: #e7eaf1; --file-fg: #2440d8;
}
[data-t="atrament"] .sky-head strong { font-weight: 700; }

[data-t="len"] {
  --font: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --bg: #f1efe9; --fg: #191817; --muted: #7c7972; --line: #eeebe4;
  --ag: #fff; --ag-shadow: 0 1px 2px rgba(0,0,0,.05); --me: #f4c430; --me-fg: #191817; --quote: #e0a800;
  --card: #fff; --card-line: transparent; --card-shadow: 0 1px 2px rgba(0,0,0,.05), 0 10px 24px -18px rgba(0,0,0,.3);
  --accent: #191817; --accent-fg: #fff; --ghost-line: #d6d2c9; --busy: #e0a800;
  --puck: #f4c430; --puck-fg: #191817; --puck-line: transparent; --puck-shadow: 0 10px 22px -12px rgba(190,140,0,.75);
  --pill: #fff; --pill-line: transparent;
  --rnd: #fff; --rnd-line: transparent; --rnd-shadow: 0 1px 2px rgba(0,0,0,.06);
  --field: #fff; --field-line: transparent; --file: #f4c430; --file-fg: #191817;
}
[data-t="len"] .msg p { font-size: 16.5px; }

[data-t="noc"] {
  color-scheme: dark;
  --head: var(--serif);
  --bg: #000; --fg: #efe9dc; --muted: #8d887c; --line: #262420;
  --ag: #1b1a17; --ag-shadow: none; --me: #efe6d3; --me-fg: #1b1a17; --quote: #d9a441;
  --card: #141311; --card-line: #262420; --card-shadow: inset 0 1px 0 rgba(255,255,255,.05);
  --accent: #efe6d3; --accent-fg: #1b1a17; --ghost-line: #3a372f; --busy: #d9a441;
  --puck: #1b1a17; --puck-fg: #efe6d3; --puck-line: #2c2a25; --puck-shadow: inset 0 1px 0 rgba(255,255,255,.07);
  --pill: #1b1a17; --pill-line: #2c2a25;
  --rnd: #1b1a17; --rnd-line: #2c2a25; --rnd-shadow: inset 0 1px 0 rgba(255,255,255,.06);
  --field: #1b1a17; --field-line: #2c2a25; --file: #262420; --file-fg: #efe6d3;
}
[data-t="noc"] .mail header strong { font: 500 18px var(--serif); }
[data-t="noc"] .tap { box-shadow: 0 0 0 2px #000; background: #262420; }

@media (max-width: 720px) {
  body { background: #000; overflow: hidden; }
  .page-head { display: none; }
  .row { padding: 0; gap: 0; height: 100dvh; scroll-snap-type: x mandatory; }
  .slot { width: 100vw; height: 100dvh; gap: 0; scroll-snap-stop: always; }
  .tag { width: 100%; height: calc(30px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); justify-content: center; background: #000; color: #fff; flex: 0 0 auto; font-size: 12.5px; }
  .tag b { background: #fff; color: #000; width: 18px; height: 18px; font-size: 11px; }
  .tag span { color: #9a9a9a; }
  .phone { width: 100vw; min-height: 0; flex: 1; border-radius: 0; box-shadow: none; }
  .thread { overflow-y: auto; }
}
</style>
</head>
<body>
<header class="page-head">
  <h1>Runda 2 · wygląd agenta</h1>
  <p>Układ jak w Twoich zrzutach: awatar na środku, pod nim to, co agent właśnie robi. Cztery wyglądy i cztery pomysły na awatar, można mieszać.</p>
</header>
<div class="row" id="row"></div>

<template id="tpl">
  <header class="top">
    <button class="rnd menu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 9h14M5 15h9"/></svg></button>
    <div class="puck"></div>
    <button class="rnd you" aria-label="Ty">J</button>
    <div class="status">Czyta źródło 3 z 5</div>
  </header>
  <main class="thread">
    <div class="day">Dziś</div>
    <div class="msg ag"><p>Dzień dobry. Dziś sprawdzian z fizyki na trzeciej lekcji, a raport o drukarkach czeka w Twórz.</p></div>
    <section class="card sky">
      <div class="sky-head">
        <div><strong>11°</strong><span>Warszawa · po 15 deszcz</span></div>
        <em>4° / 12°</em>
      </div>
      <div class="sky-band">
        <i class="rain"></i>
        <svg viewBox="0 0 100 30" preserveAspectRatio="none"><path d="M0 25 C 14 24, 24 9, 44 7 S 76 15, 100 24"/></svg>
        <i class="now"></i>
      </div>
      <div class="sky-hours"><span>6</span><span>9</span><span>12</span><span>15</span><span>18</span><span>21</span></div>
    </section>
    <div class="msg me"><p>Zrób mi PDF o silnikach hybrydowych</p></div>
    <div class="msg ag tapped"><p>Jasne, biorę się za to. Dam znać, jak skończę.</p><span class="tap">👍</span></div>
    <div class="sys">40 minut później</div>
    <div class="msg ag">
      <blockquote>Zrób mi PDF o silnikach hybrydowych</blockquote>
      <p>Hej, skończyłem ten PDF. 12 stron, na końcu porównanie trzech paliw.</p>
    </div>
    <div class="card file">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span>
      <div><strong>Silniki hybrydowe.pdf</strong><span>12 stron · 1,4 MB</span></div>
      <button class="btn solid">Otwórz</button>
    </div>
    <div class="msg ag"><p>Mam też gotowy szkic maila z projektem. Wysłać?</p></div>
    <section class="card mail">
      <header>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="3"/><path d="M4.5 8l7.5 5 7.5-5"/></svg>
        <strong>E-mail</strong>
        <svg class="edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8l-3-3L5 16z"/></svg>
      </header>
      <div class="line">Do: <b>pan Marek</b></div>
      <div class="line">Temat: <b>Projekt na fizykę</b></div>
      <p>Dzień dobry,<br>w załączniku przesyłam projekt o silnikach hybrydowych. Proszę o informację, czy taka forma wystarczy.</p>
      <p>Jurek</p>
      <div class="att"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Silniki hybrydowe.pdf<span>1,4 MB</span></div>
      <div class="btns">
        <button class="btn ghost" data-act="later">Nie teraz</button>
        <button class="btn solid" data-act="send">Wyślij</button>
      </div>
      <div class="outcome"></div>
    </section>
    <div class="msg ag typing"><i></i><i></i><i></i></div>
  </main>
  <footer class="bottom">
    <form class="composer">
      <button type="button" class="rnd plus" aria-label="Dodaj"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <div class="field">
        <input placeholder="Wiadomość" aria-label="Wiadomość" autocomplete="off">
        <button type="button" class="mic" aria-label="Dyktuj"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
      </div>
      <button class="rnd send" aria-label="Wyślij wiadomość"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </form>
    <nav class="tabs">
      <button class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-11 6.6L4 19.5l1.4-4.3A7.5 7.5 0 1 1 20 11.5z"/></svg>Czat</button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg>Zadania</button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4l1.8 5.2L18 11l-5.2 1.8L11 18l-1.8-5.2L4 11l5.2-1.8zM18.5 3.5v3M17 5h3M18.5 16.5v3M17 18h3"/></svg>Twórz</button>
    </nav>
  </footer>
</template>

<script>
const avatars = {
  orbit: '<span class="av av-orbit"><i class="tilt"><i class="ring"></i></i><i class="planet"></i><i class="tilt front"><i class="ring"></i></i><i class="tilt"><i class="spin"><i class="sat"></i></i></i></span>',
  face: '<span class="av av-face"><i></i><i></i></span>',
  bell: '<span class="av av-bell"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 22a9.5 9.5 0 0 1 19 0z"/><path d="M4 25.5h24M16 12.5v-3M13 8.5h6"/></svg></span>',
  g: '<span class="av av-g"><svg viewBox="-36.56 -134.62 199.63 199.63"><path fill="currentColor" d="M126.5 -53.62L126.5 10.5A30.5 30.5 0 0 1 96 41L13.5 41A13.5 13.5 0 0 1 13.5 14L96 14A3.5 3.5 0 0 0 99.5 10.5L99.5 -6.92A63.25 57 0 1 1 126.5 -53.62ZM27 -53.62A36.25 30 0 1 0 99.5 -53.62A36.25 30 0 1 0 27 -53.62Z"/></svg></span>'
};
const themes = [
  ["kreda", "Kreda", "awatar Orbita", "orbit"],
  ["atrament", "Atrament", "awatar Buźka", "face"],
  ["len", "Len", "awatar Dzwonek", "bell"],
  ["noc", "Noc", "awatar g z Gzowo Labs", "g"]
];
const row = document.getElementById("row");
const tpl = document.getElementById("tpl");

themes.forEach(([id, name, desc, av], i) => {
  const slot = document.createElement("section");
  slot.className = "slot";
  const tag = document.createElement("div");
  tag.className = "tag";
  tag.innerHTML = `<b>${"EFGH"[i]}</b>${name}<span>${desc}</span>`;
  const phone = document.createElement("div");
  phone.className = "phone";
  phone.dataset.t = id;
  phone.append(tpl.content.cloneNode(true));
  phone.querySelector(".puck").innerHTML = avatars[av];
  slot.append(tag, phone);
  row.append(slot);
  const thread = phone.querySelector(".thread");
  thread.scrollTop = thread.scrollHeight;
});

const clock = () => new Date().toLocaleTimeString("pl-PL", { hour: "numeric", minute: "2-digit" });

row.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]");
  if (act) {
    const mail = act.closest(".mail");
    mail.querySelector(".outcome").textContent = act.dataset.act === "send" ? `Wysłano · ${clock()}` : "Odłożone, wrócę do tego jutro rano";
    mail.classList.add("done");
    return;
  }
  const tab = e.target.closest(".tabs button");
  if (tab) tab.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === tab));
});

row.addEventListener("submit", (e) => {
  e.preventDefault();
  const input = e.target.querySelector("input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  const thread = e.target.closest(".phone").querySelector(".thread");
  const msg = document.createElement("div");
  msg.className = "msg me";
  const p = document.createElement("p");
  p.textContent = text;
  msg.append(p);
  thread.insertBefore(msg, thread.querySelector(".typing"));
  thread.scrollTop = thread.scrollHeight;
});
</script>
</body>
</html>
